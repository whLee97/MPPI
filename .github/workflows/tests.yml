name: Reproduction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
      - run: Rscript --vanilla tests/run_tests.R
      - run: Rscript --vanilla tests/test_framework.R
      - run: Rscript --vanilla tests/test_designs.R
      - run: Rscript --vanilla tests/test_parallel.R
      - run: python3 tests/test_launcher.py
      - run: python3 tests/test_cli.py
      - run: python3 tests/test_reference.py
      - run: Rscript --vanilla scripts/reproduce.R
